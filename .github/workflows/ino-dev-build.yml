name: ino_dev build

on:
  push:
    branches:
      - ino_dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test --if-present

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          echo "Build wykonany dla galezi ino_dev" > artifact/report.txt
          echo "Commit: $GITHUB_SHA" >> artifact/report.txt
          cp package.json artifact/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ino-dev-artifact
          path: artifact/
